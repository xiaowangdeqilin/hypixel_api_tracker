name: Release

# 打 tag（v3.0.0 这种）就出一整套产物：
#   - 6~8 个平台的压缩包 + 裸可执行文件（自更新直接替换用）
#   - Windows 安装器（NSIS，8 种语言）/ macOS dmg / Linux deb + rpm（多语言说明）
#   - Python FastAPI 包（wheel + sdist）
#   - 全量 SHA256SUMS.txt
# 单个平台失败不阻塞其它平台：实验性目标（arm64-musl / windows-arm64）允许失败，
# 安装器整体失败也只影响安装器。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（例如 v3.0.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # 先算矩阵：macOS 目标需要 GitHub 托管的 macOS 运行器。账号/仓库拿不到机器时，
  # 这些任务会一直排队（不是失败），整个 run 就永远停在 queued，publish 永远等不到。
  # 所以默认只跑 Linux / Windows；把仓库变量 MACOS_RUNNERS 设为 1 才加入 macOS。
  # 注意：matrix 在 job 级 if 里不可用，只能这样先算好再喂给 strategy。
  plan:
    name: plan-matrix
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.build.outputs.targets }}
      installers: ${{ steps.build.outputs.installers }}
    steps:
      - id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ vars.MACOS_RUNNERS }}" <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import sys

          macos = sys.argv[1] == "1"

          targets = [
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "ext": "tar.gz"},
              {"os": "ubuntu-24.04", "target": "aarch64-unknown-linux-gnu", "ext": "tar.gz", "cross": True},
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-musl", "ext": "tar.gz", "musl": True},
              {"os": "windows-2022", "target": "x86_64-pc-windows-msvc", "ext": "zip"},
          ]
          if macos:
              targets += [
                  {"os": "macos-14", "target": "aarch64-apple-darwin", "ext": "tar.gz", "experimental": True},
                  {"os": "macos-13", "target": "x86_64-apple-darwin", "ext": "tar.gz", "experimental": True},
              ]
          # 实验性目标：允许失败，不阻塞其它平台
          targets += [
              {"os": "ubuntu-24.04", "target": "aarch64-unknown-linux-musl", "ext": "tar.gz",
               "cross": True, "musl": True, "experimental": True},
              {"os": "windows-2022", "target": "aarch64-pc-windows-msvc", "ext": "zip", "experimental": True},
          ]

          installers = [
              {"os": "windows-2022", "kind": "windows", "target": "x86_64-pc-windows-msvc"},
              {"os": "ubuntu-24.04", "kind": "linux", "target": "x86_64-unknown-linux-gnu"},
          ]
          if macos:
              installers += [
                  {"os": "macos-14", "kind": "macos-arm64", "target": "aarch64-apple-darwin"},
                  {"os": "macos-13", "kind": "macos-x64", "target": "x86_64-apple-darwin"},
              ]

          print("targets=" + json.dumps({"include": targets}, separators=(",", ":")))
          print("installers=" + json.dumps({"include": installers}, separators=(",", ":")))
          PYEOF

  binaries:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: 安装 musl 工具链
        if: matrix.musl && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 安装 cross（跨架构 Linux）
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} \
              --bin tracker-server --bin tracker-build
          else
            cargo build --release --locked --target ${{ matrix.target }} \
              --bin tracker-server --bin tracker-build
          fi

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          TARGET="${{ matrix.target }}"
          NAME="hypixel-tracker-${TAG}-${TARGET}"
          SUFFIX=""
          case "$TARGET" in *windows*) SUFFIX=".exe" ;; esac
          SRC="target/${TARGET}/release"
          # stage/ 放解压后的目录，out/ 只放最终要发布的文件。
          # 分开是有原因的：upload-artifact 会按 glob 的公共父目录保留相对路径，
          # 若同时上传 dist/*.tar.gz 和 dist-raw/*，公共父目录变成仓库根，
          # 产物会被塞进 dist/ 子目录，下游 smoke / publish 全都找不到。
          mkdir -p "stage/${NAME}" out

          cp "${SRC}/tracker-server${SUFFIX}" "stage/${NAME}/"
          cp "${SRC}/tracker-build${SUFFIX}" "stage/${NAME}/"
          # 运行期只读资源：模板、前端脚本、103 种语言词条、版本号
          cp -r templates static locales "stage/${NAME}/"
          cp VERSION README.md "stage/${NAME}/"
          mkdir -p "stage/${NAME}/data"
          # 首次启动的种子数据，避免打开就是空白页
          cp -r data/snapshots "stage/${NAME}/data/" 2>/dev/null || true
          for f in version.json bingo.json firesales.json; do
            [ -f "data/$f" ] && cp "data/$f" "stage/${NAME}/data/" || true
          done

          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd stage && 7z a -tzip "../out/${NAME}.zip" "${NAME}" >/dev/null)
          else
            tar -C stage -czf "out/${NAME}.tar.gz" "${NAME}"
          fi

          # 裸二进制：自更新直接下载替换用，不必解压
          cp "${SRC}/tracker-server${SUFFIX}" "out/${NAME}${SUFFIX}"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  installers:
    name: installer-${{ matrix.kind }}
    needs: plan
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.installers) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.target }}

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }} --bin tracker-server --bin tracker-build

      - name: 组装安装内容
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX=""
          case "${{ matrix.target }}" in *windows*) SUFFIX=".exe" ;; esac
          SRC="target/${{ matrix.target }}/release"
          rm -rf packaging/stage packaging/out
          mkdir -p packaging/stage packaging/out
          cp "${SRC}/tracker-server${SUFFIX}" packaging/stage/
          cp "${SRC}/tracker-build${SUFFIX}" packaging/stage/
          cp -r templates static locales packaging/stage/
          cp VERSION README.md packaging/stage/
          # 多语言安装说明（8 种语言的纯文本，装完直接能看）
          cp -r packaging/docs/. packaging/stage/ 2>/dev/null || true

      - name: Windows 安装器（NSIS，8 种语言）
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DTAG=$env:RELEASE_TAG packaging/windows/installer.nsi
          Get-ChildItem packaging/out

      - name: macOS 磁盘映像
        if: startsWith(matrix.kind, 'macos')
        shell: bash
        run: bash packaging/macos/make_dmg.sh "${{ matrix.target }}"

      - name: 安装 rpm 工具（deb 不需要）
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Linux 安装包（deb + rpm）
        if: matrix.kind == 'linux'
        shell: bash
        run: bash packaging/linux/make_packages.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.kind }}
          path: packaging/out/*
          if-no-files-found: warn
          retention-days: 7

  python-package:
    name: python-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建 wheel 与 sdist
        working-directory: fastapi_app
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist --outdir ../dist-python
      - name: 冒烟测试（装上能不能启动）
        run: |
          set -euo pipefail
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist-python/*.whl
          /tmp/venv/bin/hypixel-tracker-api --version
          /tmp/venv/bin/hypixel-tracker-api --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist-python/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke-linux-x64
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dl
      - name: 解压并试跑
        run: |
          set -euo pipefail
          cd dl
          tar -xzf *.tar.gz
          DIR=$(ls -d hypixel-tracker-*/ | head -1)
          cd "$DIR"
          ./tracker-server --version
          ./tracker-server --help | head -5
          ./tracker-server --port 18099 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          python3 -c "import json;d=json.load(open('/tmp/health.json'));assert d['status']=='ok', d"
          kill "$SERVER_PID" || true

  publish:
    name: publish-release
    needs: [binaries, installers, python-package, smoke]
    if: always() && needs.binaries.result != 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物 + 生成校验和
        run: |
          set -euo pipefail
          mkdir -p release
          # 递归找，不假设 artifacts/ 下的目录层级：
          # 二进制产物是 out/*（扁平），安装器是 packaging/out/*（扁平），
          # 但下载后各自套了一层 artifact 名字，层级并不统一。
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            case "$(basename "$f")" in
              *.tar.gz|*.zip|*.whl|*.msi|*.exe|*.dmg|*.pkg|*.deb|*.rpm) cp "$f" release/ ;;
              hypixel-tracker-v*) cp "$f" release/ ;;   # 裸二进制（无扩展名）
              *) : ;;
            esac
          done
          cd release
          if [ -z "$(ls -A)" ]; then
            echo "没有任何产物，放弃发布" >&2
            exit 1
          fi
          # 自更新依赖「裸二进制 + SHA256SUMS」，缺了就等于没有自更新能力，
          # 与其发一个残缺的 Release，不如让这里红掉。
          # 第二个模式故意以目标三元组结尾（不带 .tar.gz），只匹配裸二进制
          for pattern in 'hypixel-tracker-v*.tar.gz' 'hypixel-tracker-v*x86_64-unknown-linux-gnu' '*.whl'; do
            if ! compgen -G "$pattern" >/dev/null; then
              echo "缺少关键产物：$pattern" >&2
              exit 1
            fi
          done
          ls -1 | grep -v '^SHA256SUMS.txt$' | xargs -r sha256sum > SHA256SUMS.txt
          echo "--- 产物 ---"
          ls -lh

      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Hypixel SkyBlock API Tracker $TAG" \
              --notes-file packaging/RELEASE_NOTES.md \
              --verify-tag
          fi
