name: Hypixel API Tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 数据基线在仓库里：两个 run 并行时，后跑的那个 checkout 到旧快照，
# 会把同一批变更原样再记一遍（页面上表现为「最近变更被重新填回去」）。
# 串行化：上一个 run 没结束，下一个排队等它，checkout 时自然拿到最新快照。
concurrency:
  group: pages-data-build
  cancel-in-progress: false

jobs:
  build:
    # 固定镜像标签，避免 ubuntu-latest 迁移到 Ubuntu 26 的通知与潜在行为变化
    runs-on: ubuntu-24.04
    outputs:
      # 接口或资源包获取失败时程序会输出 false，本次运行不提交、不部署
      data_written: ${{ steps.build.outputs.data_written }}
    steps:
      # 以下 action 版本均运行在 Node.js 24，消除 Node.js 20 弃用警告
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Rust 工具链 + 依赖缓存：首次构建约多花 2-4 分钟，之后增量编译约 30 秒
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build dashboard
        id: build
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
        run: cargo run --release --locked --bin tracker-build

      - name: Commit data
        if: steps.build.outputs.data_written == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ 下包含快照、变更日志、版本状态、Bingo/特卖数据与资源包清单
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update snapshots [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.build.outputs.data_written == 'true'
        with:
          path: ./site

  deploy:
    needs: build
    if: needs.build.outputs.data_written == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 每次数据更新后，重新打一个「下载即用」的 FastAPI 便携包，挂到滚动 release。
  # 不重新编译 wheel（Python 包只是读取器，代码很少变），只把源码 + 本次数据打进去。
  portable-api:
    needs: build
    if: needs.build.outputs.data_written == 'true'
    runs-on: ubuntu-24.04
    steps:
      # 数据提交在 build 里刚推到 main，这里直接取 main，保证包内是本次数据
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: 生成便携包
        run: python3 scripts/make_portable_api.py

      - name: 上传到滚动 release（data-latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="data-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "FastAPI 便携版（滚动更新）" \
              --notes "每次数据更新后自动替换下面的 zip；内含当前数据快照与运行脚本，解压即可运行。" \
              --target main
          fi
          gh release upload "$TAG" dist-portable/*.zip --clobber
